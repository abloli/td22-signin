# td22 游戏每日签到 - Loon 配置片段
#
# 使用方法：把下面两段分别粘贴到你的 Loon 配置对应区域
# （Loon -> 配置 -> 编辑，或导入为插件时把本文件内容合并进去）。
# 注意：脚本路径改成你实际存放 td22-capture.js / td22-signin.js 的位置
# （Loon 本地脚本用 script-path=本地文件名，或用远程 URL）。

[Rewrite]
# 打开签到页时自动抓取登录 Cookie（多账号：每登录一个账号打开一次即追加一条）
^https://sb\.td22\.com/ac/20240920/index\.aspx script-path=td22-capture.js, requires-body=0, timeout=10, tag=td22抓Cookie

[Script]
# 每天 9:05 跑一次多账号签到（时间可改，签到机会每天 0 点刷新）
cron "5 9 * * *" script-path=td22-signin.js, tag=td22签到, timeout=60
